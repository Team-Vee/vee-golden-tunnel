$('#bShare').onclick=function(){if(navigator.share){navigator.share({title:document.title,text:UI[lang].share,url:pageUrl()}).catch(function(){})}else copyLink()};
$('#bLang').onclick=function(){lang=lang==='bg'?'en':'bg';store.set('vtun-lang',lang);setText()};
function applyTheme(){document.documentElement.dataset.theme=theme;document.querySelector('meta[name=theme-color]').content=theme==='dark'?'#01050a':'#fbf6ea'}
$('#bTheme').onclick=function(){theme=theme==='dark'?'light':'dark';store.set('vtun-theme',theme);applyTheme();rebuildArt();AE.note(S[cur].root*2,.08,0,1.4,'sine')};
$('#pay').onclick=function(){if(PAY_URL)window.open(PAY_URL,'_blank','noopener');else toast(UI[lang].nopay)};
$('#skip').onclick=function(e){e.stopPropagation();safeInit();AE.setOn(AE.on);if(state==='idle'&&!S[cur].final)startSuck([.5,.5])};
$('#again').onclick=function(){if(state==='idle')startSuck([.5,.5])};

/* ---------------- ХОД ---------------- */
function begin(){setCounter();setText();$('#load').classList.add('off');state='idle';addRipple(.5,.5,.7);setTimeout(function(){showText(true)},500)}
function startSuck(pt){
  if(state!=='idle')return;state='suck';tS=performance.now();center=pt.slice();document.body.classList.add('busy');showText(false);$('#fin').classList.remove('on');
  stopFinale();nxt=(cur+1)%N;AE.suck(S[cur].root);hold=false;
}
function chunk(ws,n){var o=[];for(var i=0;i<ws.length;i+=n)o.push(ws.slice(i,i+n).join(' '));return o}
function flyText(){
  var L=S[nxt][lang],ws=L.m.split(' '),parts=[[L.k,'k'],[L.t,'t']].concat(chunk(ws,Math.ceil(ws.length/4)).map(function(x){return[x,'']})),fl=$('#fly');
  parts.forEach(function(p,i){setTimeout(function(){if(state!=='tunnel')return;var d=document.createElement('div');d.className='fw '+p[1];d.textContent=p[0];d.style.setProperty('--x',(Math.random()*16-8)+'%');d.style.setProperty('--y',(Math.random()*12-6)+'%');fl.appendChild(d);setTimeout(function(){d.remove()},2300)},350+i*560)})}
function startTunnel(){state='tunnel';tT=performance.now();flyText();AE.tunnel(S[nxt].root,TUN);AE.pad(S[nxt].root)}
function arrive(){
  cur=nxt;state='idle';res=0;lastRes=0;document.body.classList.remove('busy');setCounter();setText();
  var fin=S[cur].final;AE.arrive(S[cur].root,fin);flash=.8;
  addRipple(.5,.5,1);setTimeout(function(){addRipple(.5,.5,.8)},350);setTimeout(function(){addRipple(.5,.5,.6)},800);
  $('#res').style.display=fin?'none':'';
  if(fin){setTimeout(function(){$('#fin').classList.add('on');$('#txt').style.visibility='hidden';startFinale()},400)}
  else{$('#txt').style.visibility='';showText(true);stopFinale()}
}

/* финални искри */
var fx=$('#fx'),fc=fx.getContext('2d'),sp=[],finOn=false,finT=0;
function startFinale(){finOn=true;finT=0}
function stopFinale(){finOn=false;sp.length=0;fc.clearRect(0,0,fx.width,fx.height)}
function burst(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=1+Math.random()*5;sp.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,l:1,d:.008+Math.random()*.014,s:2+Math.random()*5,c:Math.random()<.55?'255,210,122':'61,220,151',g:.05})}}
function drawFx(dt){
  fc.clearRect(0,0,fx.width,fx.height);fc.globalCompositeOperation='lighter';
  finT+=dt;if(sp.length<(innerWidth<700?50:100)&&Math.random()<.5)sp.push({x:Math.random()*innerWidth,y:innerHeight+10,vx:(Math.random()-.5)*.6,vy:-(.6+Math.random()*1.8),l:1,d:.003+Math.random()*.004,s:1.5+Math.random()*3.5,c:Math.random()<.5?'255,210,122':'255,214,140',g:0,tw:Math.random()*6});
  if(finT>.9&&Math.random()<.04){var bx=innerWidth*(.15+Math.random()*.7),by=innerHeight*(.1+Math.random()*.4);burst(bx,by,24);addRipple(bx/innerWidth,1-by/innerHeight,.7);AE.note(S[cur].root*[2,2.5,3,4][Math.floor(Math.random()*4)],.07,0,1.6,'sine')}
  for(var i=sp.length-1;i>=0;i--){var p=sp[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=p.g?.985:1;p.l-=p.d;if(p.l<=0||p.y<-20){sp.splice(i,1);continue}
   var a=p.l*(p.tw!==undefined?.55+.45*Math.sin(finT*6+p.tw):1);
   var g=fc.createRadialGradient(p.x,p.y,0,p.x,p.y,p.s*4);g.addColorStop(0,'rgba('+p.c+','+a+')');g.addColorStop(1,'rgba('+p.c+',0)');fc.fillStyle=g;fc.fillRect(p.x-p.s*4,p.y-p.s*4,p.s*8,p.s*8);
   fc.fillStyle='rgba(255,255,255,'+a*.9+')';fc.fillRect(p.x-p.s*.15,p.y-p.s*1.3,p.s*.3,p.s*2.6);fc.fillRect(p.x-p.s*1.3,p.y-p.s*.15,p.s*2.6,p.s*.3)}
  fc.globalCompositeOperation='source-over';
}

/* ---------------- ВХОД ---------------- */
function uvOf(e){return[e.clientX/innerWidth,1-e.clientY/innerHeight]}
function addRes(v){if(S[cur].final||state!=='idle')return;res=Math.min(1,res+v);lastRes=performance.now();setHint();if(res>=1)startSuck(last.slice())}
function evt(e){var p=(e.touches&&e.touches[0])||(e.changedTouches&&e.changedTouches[0])||e;return{clientX:p.clientX,clientY:p.clientY,target:e.target}}
function onDown(e0){var e=evt(e0);
  if(e.target&&e.target.closest&&e.target.closest('button,a,.card,header'))return;
  safeInit();if(AE.ready&&AE.ctx.state==='suspended'&&AE.on)AE.ctx.resume();
  if(state!=='idle')return;
  var p=uvOf(e);last=p;hold=true;lastDrop=performance.now();addRipple(p[0],p[1],1);AE.drop(p[0],S[cur].root);addRes(.13);
  if(S[cur].final)burst(e.clientX,e.clientY,22);
}
function onMove(e0){var e=evt(e0);
  if(!hold||state!=='idle')return;var p=uvOf(e),dx=(p[0]-last[0])*innerWidth,dy=(p[1]-last[1])*innerHeight,d=Math.sqrt(dx*dx+dy*dy),t=performance.now();
  last=p;if(d>38&&t-lastDrop>110){lastDrop=t;addRipple(p[0],p[1],.75);AE.drop(p[0],S[cur].root);addRes(.035);if(S[cur].final&&Math.random()<.5)burst(e.clientX,e.clientY,8)}
}
function up(){hold=false}
if(window.PointerEvent){addEventListener('pointerdown',onDown);addEventListener('pointermove',onMove);addEventListener('pointerup',up);addEventListener('pointercancel',up)}
else{addEventListener('touchstart',onDown,{passive:true});addEventListener('touchmove',onMove,{passive:true});addEventListener('touchend',up);addEventListener('touchcancel',up);addEventListener('mousedown',onDown);addEventListener('mousemove',onMove);addEventListener('mouseup',up)}
addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&state==='idle'&&!S[cur].final&&!(e.target.closest&&e.target.closest('button,a'))){safeInit();startSuck([.5,.5])}});

/* ---------------- РЕНДЕР ---------------- */
var running=true,prev=performance.now(),rfg=$('#rfg'),pulseT=0;
document.addEventListener('visibilitychange',function(){running=!document.hidden;prev=performance.now();if(running)loop()});
function loop(){
  if(!running)return;requestAnimationFrame(loop);
  var t=performance.now(),dt=Math.min(.05,(t-prev)/1000);prev=t;
  if(state==='load')return;
  var suck=0,pre=0,tp=0,tt=0;
  if(state==='idle'){
    if(hold&&!S[cur].final){res=Math.min(1,res+dt*.5);pulseT+=dt;if(pulseT>.38){pulseT=0;addRipple(last[0],last[1],.55);AE.drop(.1+Math.random()*.5,S[cur].root*.5)}setHint();if(res>=1)startSuck(last.slice())}
    else{pulseT=0;if(t-lastRes>1400&&res>0){res=Math.max(0,res-dt*.08);setHint()}}
    pre=res*.2;center=last;
  }else if(state==='suck'){var xx=(t-tS)/1000/SUCK;suck=Math.min(1,xx);suck=suck*suck*(3-2*suck)*.5+suck*.5;suck=Math.min(1,suck);if(xx>=1)startTunnel()}
  else if(state==='tunnel'){tt=(t-tT)/1000;tp=Math.min(1,tt/TUN);if(tt>=TUN)arrive()}
  rfg.style.strokeDashoffset=213.6*(1-res);
  flash=Math.max(0,flash-dt*.9);
  if(finOn)drawFx(dt);
  if(noGL){var k=cur+'_'+theme+portrait;if(!fbCache[k])fbCache[k]='url('+ART[cur].toDataURL('image/jpeg',.82)+')';fbEl.style.backgroundImage=fbCache[k];return}
  var lt=theme==='light'?1:0;
  gl.useProgram(state==='tunnel'?progT:progS);
  if(state==='tunnel'){
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(uT.a);gl.vertexAttribPointer(uT.a,2,gl.FLOAT,false,0,0);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texs[nxt]);gl.uniform1i(uT.uB,0);gl.uniform2f(uT.uRes,W,H);gl.uniform1f(uT.uTT,tt);gl.uniform1f(uT.uProg,tp);gl.uniform4fv(uT.uFit,fit(nxt));gl.uniform1f(uT.uLight,lt);
  }else{
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(uS.a);gl.vertexAttribPointer(uS.a,2,gl.FLOAT,false,0,0);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texs[cur]);gl.uniform1i(uS.uA,0);gl.uniform2f(uS.uRes,W,H);gl.uniform1f(uS.uT,now());gl.uniform4fv(uS.uFit,fit(cur));gl.uniform4fv(uS.uR,rip);
    gl.uniform1f(uS.uSuck,suck);gl.uniform1f(uS.uPre,pre);gl.uniform2f(uS.uC,center[0],center[1]);gl.uniform1f(uS.uFlash,flash);gl.uniform1f(uS.uLight,lt);
  }
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}

/* ---------------- СТАРТ ---------------- */
function loadPhoto(){return new Promise(function(res){
  function tryLoad(src,next){var im=new Image();im.onload=function(){res(im)};im.onerror=next;im.src=src}
  tryLoad(PHOTO_FALLBACK,function(){tryLoad(PHOTO_FILE,function(){res(null)})});
})}
async function boot(){
  applyTheme();
  try{
    if(document.fonts&&document.fonts.load){
      var tests=['600 40px "Cormorant Garamond"','500 20px "JetBrains Mono"'];
      await Promise.race([Promise.all(tests.map(function(x){return document.fonts.load(x,'Au XAU/USD LIVE V')})),new Promise(function(r){setTimeout(r,3000)})]);
    }
    PH=await loadPhoto();
    resize();rebuildArt();
    begin();
  }catch(e){console.warn(e);document.body.classList.add('nogl')}
  requestAnimationFrame(loop);
}
window.__td={suck:function(){safeInit();startSuck([.5,.5])},state:function(){return state},cur:function(){return cur},set:function(i){cur=i;setCounter();setText();$('#res').style.display=S[i].final?'none':'';if(S[i].final){$('#fin').classList.add('on');$('#txt').style.visibility='hidden'}else{$('#fin').classList.remove('on');$('#txt').style.visibility=''}}};
boot();
})();
</script>
