  if(state==='load')return;

  }else{
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.enableVertexAttribArray(uS.a);gl.vertexAttribPointer(uS.a,2,gl.FLOAT,false,0,0);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,texs[cur]);gl.uniform1i(uS.uA,0);gl.uniform2f(uS.uRes,W,H);gl.uniform1f(uS.uT,now());gl.uniform4fv(uS.uFit,fit(cur));gl.uniform4fv(uS.uR,rip);
    gl.uniform1f(uS.uSuck,suck);gl.uniform1f(uS.uPre,pre);gl.uniform2f(uS.uC,center[0],center[1]);gl.uniform1f(uS.uFlash,flash);gl.uniform1f(uS.uLight,lt);
  }

}
